name: API spec

# Fails when rlgym-server/openapi.json doesn't match the FastAPI routes, i.e. the backend was
# changed without regenerating the spec (run `npm start` or `npm run gen:spec` in rlgym-app).

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: rlgym-server/requirements.txt

      - name: Export spec
        working-directory: rlgym-server
        run: |
          pip install -r requirements.txt
          python scripts/export_openapi.py

      - name: Check committed spec is up to date
        run: git diff --exit-code -- rlgym-server/openapi.json
