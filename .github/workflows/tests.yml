name: Tests

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rlgym-app
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rlgym-app/package-lock.json

      # postinstall generates the API client, which needs Java (preinstalled on the runner).
      - run: npm ci

      - run: npx ng test --watch=false

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rlgym-server
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            rlgym-server/requirements.txt
            rlgym-server/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: pytest -v
