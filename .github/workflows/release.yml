name: Release

# Runs when a release/* or hotfix/* PR is merged into master (the normal path: the workflow tags the
# release itself), or when a v* tag is pushed by hand (fallback).
on:
  push:
    tags: ['v*']
  pull_request:
    types: [closed]
    branches: [master]

env:
  CHANGELOG_PATH: rlgym-app/CHANGELOG.md

jobs:
  prepare:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.merged &&
       (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/')))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Read and check version
        id: version
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          VERSION=$(node -p "require('./electron/package.json').version")
          APP_VERSION=$(node -p "require('./rlgym-app/package.json').version")
          if [ "$APP_VERSION" != "$VERSION" ]; then
            echo "::error::rlgym-app/package.json ($APP_VERSION) does not match electron/package.json ($VERSION). Run scripts/release.mjs."
            exit 1
          fi
          if [ "$EVENT" = "push" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
              echo "::error::Tag ($GITHUB_REF_NAME) does not match electron/package.json ($VERSION)"
              exit 1
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::v$VERSION is already released. Run scripts/release.mjs on the release branch to bump the version."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check changelog has an entry for this version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -qE "^## \[?v?${VERSION//./\\.}\]?( |$)" "$CHANGELOG_PATH"; then
            echo "::error::$CHANGELOG_PATH has no '## [$VERSION]' section"
            exit 1
          fi

  build:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            rlgym-app/package-lock.json
            electron/package-lock.json

      - name: Build Angular app
        working-directory: rlgym-app
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: rlgym-server/requirements.txt

      # worker.py runs in the user's interpreter, so it ships as a plain data file
      # (found at runtime by app.config.worker_script(), under sys._MEIPASS = _internal/).
      - name: Freeze backend
        working-directory: rlgym-server
        run: |
          pip install -r requirements.txt pyinstaller==6.22.3
          pyinstaller main.py --name rlgym-backend --noconfirm --clean --collect-submodules uvicorn --add-data "worker/worker.py;worker"
          if (-not (Test-Path dist/rlgym-backend/_internal/worker/worker.py)) { throw "worker.py is missing from the frozen backend" }

      - name: Smoke-test frozen backend
        working-directory: rlgym-server
        run: |
          $env:RLGYM_GUI_PORT = "8123"
          $env:RLGYM_GUI_TOKEN = "ci"
          $p = Start-Process dist/rlgym-backend/rlgym-backend.exe -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            try {
              $r = Invoke-WebRequest http://127.0.0.1:8123/health -Headers @{ "X-Api-Token" = "ci" } -UseBasicParsing
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { Start-Sleep -Seconds 1 }
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "Frozen backend did not become healthy" }

      - name: Package Electron app
        working-directory: electron
        run: |
          npm ci
          npm run pack:dist

      - uses: actions/upload-artifact@v7
        with:
          name: windows-dist
          path: |
            electron/dist/*.exe
            electron/dist/*.exe.blockmap
            electron/dist/latest.yml
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Extract release notes
        uses: ffurrer2/extract-release-notes@v3
        with:
          changelog_file: ${{ env.CHANGELOG_PATH }}
          release_notes_file: release_notes.md

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Creates the v* tag on the merge commit if it doesn't exist yet. A tag created with
      # GITHUB_TOKEN doesn't trigger workflows, so this doesn't start a second release run.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          body_path: release_notes.md
          files: artifacts/*

  back-merge:
    needs: [prepare, release]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # Needs "Allow GitHub Actions to create and approve pull requests" in the repo settings.
      - name: Open master -> dev pull request
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_PR: ${{ github.event.pull_request.html_url }}
        run: |
          KEY=$(grep -oE 'RLGYM-[0-9]+' <<< "$HEAD_REF" || true)
          BODY="Brings the v$VERSION release ($RELEASE_PR) back into dev. Merge it with a merge commit, not a squash, so master stays an ancestor of dev."
          if [ -n "$KEY" ]; then
            TITLE="release: $KEY - Back-merge v$VERSION into dev"
            BODY="**Ticket:** [$KEY](https://mathsuch63.atlassian.net/browse/$KEY)"$'\n\n'"$BODY"
          else
            TITLE="release: Back-merge v$VERSION into dev"
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base dev --head master \
            --title "$TITLE" --body "$BODY" --label release
