<svg
      viewBox="0 0 400 260"
      role="img"
      aria-label="Top-down view of a Rocket League field at kickoff, with a blue and an orange car heading toward the ball"
      class="w-full text-slate-300 dark:text-slate-700"
    >
      <!-- goals -->
      <rect x="6" y="100" width="14" height="60" rx="3" fill="none" stroke="currentColor" stroke-width="2" />
      <rect x="380" y="100" width="14" height="60" rx="3" fill="none" stroke="currentColor" stroke-width="2" />
      <!-- field -->
      <rect x="20" y="20" width="360" height="220" rx="28" fill="none" stroke="currentColor" stroke-width="2" />
      <line x1="200" y1="20" x2="200" y2="240" stroke="currentColor" stroke-width="1.5" />
      <circle cx="200" cy="130" r="38" fill="none" stroke="currentColor" stroke-width="1.5" />

      <!-- boost pads -->
      <g fill="currentColor">
        <circle cx="52" cy="52" r="5" /><circle cx="348" cy="52" r="5" />
        <circle cx="52" cy="208" r="5" /><circle cx="348" cy="208" r="5" />
        <circle cx="110" cy="130" r="2" /><circle cx="290" cy="130" r="2" />
        <circle cx="200" cy="66" r="2" /><circle cx="200" cy="194" r="2" />
      </g>

      <!-- paths -->
      <path d="M92 188 C130 180 165 155 190 137" fill="none" stroke-width="2" stroke-dasharray="4 5" class="stroke-blue-500" />
      <path d="M308 72 C270 80 235 105 210 123" fill="none" stroke-width="2" stroke-dasharray="4 5" class="stroke-orange-500" />

      <!-- cars -->
      <rect x="-12" y="-6" width="24" height="12" rx="3" transform="translate(88 190) rotate(-25)" class="fill-blue-500" />
      <rect x="-12" y="-6" width="24" height="12" rx="3" transform="translate(312 70) rotate(155)" class="fill-orange-500" />

      <!-- ball -->
      <circle cx="200" cy="130" r="8" stroke-width="2" class="fill-white stroke-slate-900 dark:fill-slate-900 dark:stroke-slate-100" />
    </svg>
